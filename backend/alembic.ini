# Alembic configuration for woonam-auto-trading.
# DB URL is NOT set here -- alembic/env.py reads it from core.config
# (which in turn reads from environment / .env). That keeps secrets
# out of files in the repo.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
timezone = UTC

# Use this format so migration filenames sort lexicographically by
# creation date AND keep a short slug, e.g.
#   2026_05_26_1530_initial_schema.py
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d_%%(slug)s

# We commit migrations as part of the repo, so no remote stamping.

[post_write_hooks]
# Run ruff format on every newly generated migration so they match
# repo style.
hooks = ruff_format
ruff_format.type = console_scripts
ruff_format.entrypoint = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Logging -- handled by core.logging at runtime, but keep something
# here for `alembic` CLI standalone usage.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
