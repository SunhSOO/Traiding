[project]
name = "woonam-auto-trading"
version = "0.1.0"
description = "KR+US equity auto-trading driven by composite fundamental/technical/information analysis"
requires-python = ">=3.12,<3.13"
readme = "../README.md"
license = { text = "MIT" }

dependencies = [
  # Web / API
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "websockets>=13",
  "httpx>=0.27",
  "python-multipart>=0.0.18",          # OAuth2PasswordRequestForm body parsing

  # DB
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg[binary]>=3.2",
  "asyncpg>=0.30",

  # Auth + secrets
  "python-dotenv>=1.0",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "bcrypt<4.0",                        # passlib 1.7.4 reads bcrypt.__about__ which 4.x removed

  # Scheduler (Phase 1+)
  "apscheduler>=3.10",

  # Data ingestion (Phase 1)
  "pykrx>=1.0",
  "finance-datareader>=0.9",
  "yfinance>=0.2",
  "OpenDartReader>=0.2",
  "sec-edgar-downloader>=5.0",

  # DataFrames + scientific
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.13",

  # Technical analysis (Phase 2)
  "pandas-ta>=0.3.14b0",

  # LLM providers (Phase 2)
  "ollama>=0.3",
  "google-generativeai>=0.8",

  # NLP / NER for KR/EN (Phase 2)
  "spacy>=3.7",
  # konlpy is heavy and Java-backed; install on demand in Phase 2 when actually used.

  # Trading calendars (Phase 0 markets module)
  "exchange-calendars>=4.5",
  # IANA tz database (required on Windows; stdlib zoneinfo has no fallback there)
  "tzdata>=2024.2; sys_platform == 'win32'",

  # Logging
  "structlog>=24.4",

  # Retry / resilience
  "tenacity>=9.0",

  # MT5 — kept for FX/gold only. Optional; package is Windows-only.
  "MetaTrader5>=5.0; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "ruff>=0.7",
  "mypy>=1.13",
  "types-passlib",
  "types-python-jose",
]

# Phase 3 — heavy ML/backtest stack; pulled in only when training starts to keep base env light.
ml = [
  "lightgbm>=4.5",
  "xgboost>=2.1",
  "catboost>=1.2",
  "scikit-learn>=1.5",
  "vectorbt>=0.26",
  "quantstats>=0.0.62",
  "mlflow>=2.17",
  "optuna>=4.0",
  "hmmlearn>=0.3",
  "google-cloud-bigquery>=3.27",
  "google-cloud-bigquery-storage>=2.27",
  "pandas-gbq>=0.24",
  "torch>=2.4",
  "joblib>=1.4",
  "pysentiment2>=0.1.1",
  "darts>=0.44.1",
  "pytorch-forecasting>=1.7.0",
  "econml>=0.16.0",
  "transformers>=5.9.0",
  "pywavelets>=1.9.0",
  "pytrends>=4.9.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra --strict-markers"
markers = [
  "integration: tests that hit the real DB / network / LLM",
  "slow: tests that take more than 1s",
]

[tool.ruff]
target-version = "py311"
line-length = 110
extend-exclude = ["alembic/versions/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "SIM"]
ignore = ["E501"]  # handled by formatter

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
warn_return_any = true
ignore_missing_imports = true   # many trading libs lack stubs
